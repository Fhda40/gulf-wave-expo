name: Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:sites
      - run: npm run test:security
